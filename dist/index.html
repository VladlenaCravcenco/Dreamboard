<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Сохраняйте мечты, делайте маленькие шаги и собирайте воспоминания">
  <meta name="theme-color" content="#fafafa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dreamboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dreamboard — мечты и воспоминания</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Versioned URLs refresh browser icon caches after the brand update. -->
  <link rel="icon" href="/favicon.ico?v=pixel-1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=pixel-1">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=pixel-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=pixel-1">
  <link rel="mask-icon" href="/safari-pinned-tab.svg?v=pixel-1" color="#111111">
  
  <script type="module" crossorigin src="/assets/index-2zQEeQLk.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BOWZ5RAc.css">
</head>
<body>
  <div id="root"></div>
  
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (sessionStorage.getItem('dreamboard-sw-reloaded')) return;
        sessionStorage.setItem('dreamboard-sw-reloaded', 'true');
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered:', registration);
            registration.update();
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
