<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Сохраняйте мечты и желания, делайте маленькие шаги к ним и делитесь вишлистом с друзьями: они тайно выберут подарок, а сюрприз сохранится.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dreamboard">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Dreamboard — мечты, желания и подарки">
  <meta property="og:description" content="Собирайте желания, делитесь списком с друзьями и сохраняйте воспоминания о сбывшихся мечтах.">
  <meta property="og:image" content="https://dreamboard-three.vercel.app/share-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Dreamboard — подарки, о которых мечтают">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#fafafa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dreamboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dreamboard — список желаний, мечты и вишлист для друзей</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <!-- Returning users: hide the prerendered guest landing until the app restores the session (see src/app/lib/storedSession.ts). -->
  <style>.has-session [data-prerendered] { display: none; }</style>
  <script>
    try {
      if (/access_token=|refresh_token=/.test(location.hash) || /[?&]code=/.test(location.search) ||
          Object.keys(localStorage).some(function (key) { return key.indexOf('sb-') === 0 && /-auth-token$/.test(key); })) {
        document.documentElement.classList.add('has-session');
      }
    } catch (e) {}
  </script>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Versioned URLs refresh browser icon caches after the brand update. -->
  <link rel="icon" href="/favicon.ico?v=pixel-1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=pixel-1">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=pixel-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=pixel-1">
  <link rel="mask-icon" href="/safari-pinned-tab.svg?v=pixel-1" color="#111111">
  
  <script type="module" src="/src/main.tsx"></script>
</head>
<body>
  <div id="root"></div>
  
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (sessionStorage.getItem('dreamboard-sw-reloaded')) return;
        sessionStorage.setItem('dreamboard-sw-reloaded', 'true');
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered:', registration);
            registration.update();
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
